name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pure scoring tests
        run: node --test test/*.test.mjs
      - name: Build registry (deterministic)
        run: node scripts/aggregate.mjs --today 2026-10-18
      - name: Export the dsh-recommend sidecar
        run: node scripts/export-recommend.mjs
      - name: Build versioned API and market signals
        run: |
          node scripts/build-api.mjs
          node scripts/build-signals.mjs
      - name: Pre-registration hash must match
        run: node scripts/preregister.mjs --check
      - name: P2/P3 conformance
        run: node scripts/conformance.mjs
      - name: P0 invariants (unrated, no prior #1, formula)
        run: node scripts/check-invariants.mjs
      - name: Syntax-check site and reliability layer
        run: |
          node --check site/app.js
          node --check scripts/reliability.mjs
          node --check scripts/bench-run.mjs
          node --check scripts/verify-result.mjs
          node --check scripts/ingest-result.mjs
          node --check scripts/identity.mjs
          node --check scripts/match-brief.mjs
          node --check scripts/recommend.mjs
          node --check scripts/preregister.mjs
          node --check scripts/audit-check.mjs
          node --check scripts/conformance.mjs
      - name: Generated files must be committed
        run: git diff --exit-code
      - name: Check generated JSON parses
        run: |
          node -e "const r=JSON.parse(require('fs').readFileSync('data/registry.json','utf8')); if(r.schema!=='dsh-attention/registry/v1') process.exit(1); console.log(r.stats)"
      - name: Lint bench runner (syntax)
        run: node --check scripts/bench-run.mjs
